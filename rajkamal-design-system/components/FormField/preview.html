<!doctype html>
<html><head><meta charset="utf-8"><title>FormField</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Yatra+One&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="ds-col" style="max-width:380px">
  <div class="fm-field"><label for="n">Full name</label><input id="n" value="Anuradha Beniwal"></div>
  <div class="fm-field is-focus"><label for="e">Email address <i>(optional)</i></label><input id="e" placeholder="you@example.com"></div>
  <div class="fm-field is-bad"><label for="p">Mobile number</label><input id="p" value="98102"><span class="fm-err">Enter a 10-digit mobile number</span></div>
  <div class="fm-check"><input type="checkbox" id="c" checked><label for="c">I agree to the Terms &amp; Conditions.</label></div>
</div>
</body></html>
