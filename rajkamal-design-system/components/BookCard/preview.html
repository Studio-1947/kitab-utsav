<!doctype html>
<html><head><meta charset="utf-8"><title>BookCard</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Yatra+One&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="bk-grid">
  <article class="hm-card">
    <a class="hm-cover" href="#"><img src="../../assets/Samples/mitro-marjani.jpg" alt="Mitro Marjani cover"></a>
    <div class="hm-info">
      <p class="hm-cat">Women's Novel</p>
      <h3 class="hm-name"><a href="#">Mitro Marjani</a></h3>
      <p class="hm-author">Krishna Sobti</p>
      <div class="hm-price"><strong>₹200</strong><s>₹250</s><span class="hm-off">20% off</span></div>
      <div class="hm-actions"><button class="bk-btn bk-btn--cart" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2h11.3l2-8H6.3"/></svg> Add to cart</button><button class="bk-btn bk-btn--wish" type="button" aria-label="Add to wishlist"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.7 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.5 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg></button></div>
    </div>
  </article>
  <article class="hm-card">
    <a class="hm-cover" href="#"><img src="../../assets/Samples/path-ke-sathi.jpg" alt="Path Ke Sathi cover"></a>
    <div class="hm-info">
      <p class="hm-cat">Memoirs</p>
      <h3 class="hm-name"><a href="#">Path Ke Sathi</a></h3>
      <p class="hm-author">Mahadevi Verma</p>
      <div class="hm-price"><strong>₹179</strong><s>₹199</s><span class="hm-off">10% off</span></div>
      <div class="hm-actions"><button class="bk-btn bk-btn--cart is-added" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2h11.3l2-8H6.3"/></svg> Added</button><button class="bk-btn bk-btn--wish is-on" type="button" aria-label="Remove from wishlist"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.7 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.5 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg></button></div>
    </div>
  </article>
  <article class="hm-card">
    <a class="hm-cover no-img" href="#"><span class="hm-cover__title">Pachpan Khambhe Lal Deewaren</span></a>
    <div class="hm-info">
      <p class="hm-cat">Women's Novel</p>
      <h3 class="hm-name"><a href="#">Pachpan Khambhe Lal Deewaren</a></h3>
      <p class="hm-author">Usha Priyamvada</p>
      <div class="hm-price"><strong>₹200</strong><s>₹250</s><span class="hm-off">20% off</span></div>
      <div class="hm-actions"><span class="hm-oos">Out of stock</span></div>
    </div>
  </article>
</div>
</body></html>
